name: App and security checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/flutter
            ~/.pub-cache
          key: flutter-c197ca5199-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Install the tested Flutter revision
        shell: bash
        run: |
          if [ ! -d "$RUNNER_TEMP/flutter/.git" ]; then
            git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
            git -C "$RUNNER_TEMP/flutter" checkout c197ca5199e9ee5661e865596c9c07294dfab51c
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --no-wasm-dry-run
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tooling/firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: tooling/firebase
      - run: npm test
        working-directory: tooling/firebase
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm run test:alerts
        working-directory: tooling/firebase
